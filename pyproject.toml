[project]
name = "olist-talk"
version = "0.1.0"
description = "Ask questions about the Olist e-commerce dataset in natural language"
authors = [
    { name = "jordiboon", email = "jordi.boon01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "duckdb>=1.5.5",
    "logfire>=5.1.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
olist-talk = "olist_talk.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
